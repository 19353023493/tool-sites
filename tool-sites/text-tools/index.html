<main><h1>📝 文本工具箱</h1><p class="subtitle">文本去重排序 / 大小写转换 / URL 编解码</p>
<div class="ad-banner">📢 广告位 — Google AdSense</div>
<details class="guide"><summary>使用说明 · 点击展开</summary><div class="guide-content"><p><strong>🔤 文本去重排序</strong> — 粘贴多行文本，去重复行、按字母/数字排序<br><strong>🔠 大小写转换</strong> — 一键转大写/小写/首字母大写<br><strong>🔗 URL编解码</strong> — 把中文网址变成百分号格式，或反过来解码</p></div></details>
<div class="tabs"><button class="active-tab" onclick="switchTab('dedup')">去重排序</button><button onclick="switchTab('case')">大小写</button><button onclick="switchTab('url')">URL编解码</button></div>
<div class="tab-content show" id="dedup"><textarea id="dedupInput" placeholder="每行一个内容，粘贴到这里..."></textarea><div class="btn-row"><button class="btn-primary" onclick="processDedup('unique')">去重复行</button><button onclick="processDedup('sort')">按字母排序</button><button onclick="processDedup('reverse')">反转顺序</button><button onclick="processDedup('trim')">去除空行</button></div><textarea id="dedupOutput" placeholder="结果..." readonly></textarea><div class="stats" id="dedupStats"></div></div>
<div class="tab-content" id="case"><textarea id="caseInput" placeholder="输入文本..."></textarea><div class="btn-row"><button class="btn-primary" onclick="processCase('upper')">全部大写</button><button onclick="processCase('lower')">全部小写</button><button onclick="processCase('capitalize')">首字母大写</button><button onclick="processCase('title')">每个词首字母大写</button></div><textarea id="caseOutput" placeholder="结果..." readonly></textarea></div>
<div class="tab-content" id="url"><textarea id="urlInput" placeholder="输入文本或URL编码字符串..."></textarea><div class="btn-row"><button class="btn-primary" onclick="processURL('encode')">URL 编码</button><button onclick="processURL('decode')">URL 解码</button></div><textarea id="urlOutput" placeholder="结果..." readonly></textarea></div>
<div class="ad-banner">📢 广告位 — Google AdSense</div></main>

<script>const $=s=>document.querySelector(s);
function switchTab(tab){document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active-tab'));document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('show'));$('#'+tab).classList.add('show');event.target.classList.add('active-tab')}
function processDedup(mode){const lines=$('#dedupInput').value.split('\n');let result;switch(mode){case'unique':result=[...new Set(lines)];break;case'sort':result=[...lines].sort();break;case'reverse':result=[...lines].reverse();break;case'trim':result=lines.filter(l=>l.trim());break}$('#dedupOutput').value=result.join('\n');$('#dedupStats').textContent=`输入 ${lines.length} 行 → 输出 ${result.length} 行`}
function processCase(mode){const text=$('#caseInput').value;let result;switch(mode){case'upper':result=text.toUpperCase();break;case'lower':result=text.toLowerCase();break;case'capitalize':result=text.charAt(0).toUpperCase()+text.slice(1).toLowerCase();break;case'title':result=text.replace(/\w\S*/g,w=>w.charAt(0).toUpperCase()+w.slice(1).toLowerCase());break}$('#caseOutput').value=result}
function processURL(mode){const text=$('#urlInput').value;try{$('#urlOutput').value=mode==='encode'?encodeURIComponent(text):decodeURIComponent(text)}catch(e){toast('解码失败：' + e.message)}}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500)}</script>
