.ad-banner{max-width:960px;margin:12px auto;padding:10px;background:var(--bg-card);border-radius:var(--radius);text-align:center;color:var(--text-muted);font-size:12px;border:1px dashed rgba(255,255,255,.08)}

/* Tab bar */
.tabs{display:flex;gap:4px;margin-bottom:20px;background:var(--bg-card);border-radius:var(--radius);padding:4px}
.tabs button{flex:1;padding:10px;border:none;border-radius:8px;background:transparent;color:var(--text-muted);cursor:pointer;font-size:14px;font-family:inherit;transition:all .2s}
.tabs button:hover{color:var(--text)}
.tabs button.active{background:var(--accent);color:#fff}
/* Generator section */
.section{display:none}
.section.active{display:block}
/* AI palette */
.ai-controls{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.ai-controls input{flex:1;min-width:200px;padding:12px 16px;background:var(--bg-card);border:1px solid rgba(255,255,255,.08);border-radius:var(--radius);color:var(--text);font-size:14px;font-family:inherit;outline:none}
.ai-controls input:focus{border-color:var(--accent)}
.ai-controls select{padding:12px 16px;background:var(--bg-card);border:1px solid rgba(255,255,255,.08);border-radius:var(--radius);color:var(--text);font-size:14px;font-family:inherit;cursor:pointer;outline:none}
.ai-controls button{padding:12px 24px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius);font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap}
.ai-controls button:hover{opacity:.9}
/* Palette display */
.palette{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px;margin-bottom:16px}
.swatch{border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:transform .2s;border:1px solid rgba(255,255,255,.06)}
.swatch:hover{transform:translateY(-4px)}
.swatch .color-block{height:100px;transition:filter .2s}
.swatch:hover .color-block{filter:brightness(1.1)}
.swatch .info{padding:10px;background:var(--bg-card);font-size:12px}
.swatch .info .hex{font-weight:600;font-family:'JetBrains Mono',monospace}
.swatch .info .role{color:var(--text-muted);margin-top:2px;font-size:11px}
/* Extract from image */
.extract-zone{border:2px dashed rgba(255,255,255,.1);border-radius:var(--radius);padding:40px;text-align:center;cursor:pointer;transition:all .3s;background:var(--bg-card)}
.extract-zone:hover{border-color:var(--accent)}
.extract-zone input{display:none}
.extract-zone .icon{font-size:40px;margin-bottom:8px}
/* Image preview + colors */
.extract-result{display:none;margin-top:16px}
.extract-result.show{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
@media(max-width:600px){.extract-result.show{grid-template-columns:1fr}}
.extract-preview img{width:100%;border-radius:var(--radius)}
.extracted-colors{display:flex;flex-direction:column;gap:8px}
.extracted-color{display:flex;align-items:center;gap:12px;padding:8px 16px;background:var(--bg-card);border-radius:8px}
.extracted-color .dot{width:40px;height:40px;border-radius:8px;flex-shrink:0}
.extracted-color .hex{font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:600;flex:1}
.extracted-color .pct{color:var(--text-muted);font-size:12px}
/* Gradient */
.gradient-controls{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap;align-items:end}
.gradient-controls label{font-size:13px;color:var(--text-muted);display:flex;flex-direction:column;gap:4px}
.gradient-controls input[type=color]{width:60px;height:40px;border:1px solid rgba(255,255,255,.1);border-radius:6px;background:transparent;cursor:pointer}
.gradient-controls select{padding:8px 12px;background:var(--bg-card);border:1px solid rgba(255,255,255,.08);border-radius:8px;color:var(--text);font-family:inherit;font-size:13px}
.preview-gradient{width:100%;height:200px;border-radius:var(--radius);margin-bottom:12px;border:1px solid rgba(255,255,255,.06)}
.gradient-css{width:100%;padding:12px 16px;background:var(--bg-card);border:1px solid rgba(255,255,255,.08);border-radius:var(--radius);color:var(--text);font-family:'JetBrains Mono',monospace;font-size:12px;resize:none;outline:none}
/* Trend palettes */
.trends-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.trend-card{background:var(--bg-card);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:transform .2s;border:1px solid rgba(255,255,255,.04)}
.trend-card:hover{transform:translateY(-4px)}
.trend-card .mini-swatches{display:flex;height:60px}
.trend-card .mini-swatch{flex:1}
.trend-card .t-info{padding:12px}
.trend-card .t-name{font-weight:600;font-size:14px}
.trend-card .t-desc{color:var(--text-muted);font-size:12px;margin-top:4px}
/* Toast */
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#22c55e;color:#000;padding:10px 24px;border-radius:20px;font-size:14px;z-index:999;font-weight:600;pointer-events:none;opacity:0;transition:opacity .3s}
.toast.show{opacity:1}
footer{text-align:center;padding:28px;color:var(--text-muted);font-size:12px;border-top:1px solid rgba(255,255,255,.05);margin-top:32px}

<script>
const $=s=>document.querySelector(s);

// ====== AI Palette Generator ======
const PALETTE_RULES = {
  modern: {hueShift:[0,30,180,210,330], sat:[60,40,70,20,80], light:[55,40,95,25,65]},
  dark: {hueShift:[0,0,30,210,260], sat:[10,20,80,60,90], light:[15,25,55,40,60]},
  warm: {hueShift:[0,15,25,40,350], sat:[80,60,40,70,50], light:[50,65,85,35,75]},
  cool: {hueShift:[200,220,180,240,210], sat:[50,70,40,80,30], light:[50,40,85,35,70]},
  vibrant: {hueShift:[0,50,170,280,140], sat:[100,90,80,95,85], light:[50,60,40,55,45]},
  muted: {hueShift:[20,40,200,340,160], sat:[30,25,20,35,15], light:[70,60,85,75,55]},
  mono: {hueShift:[0,0,0,0,0], sat:[5,10,60,30,0], light:[40,60,80,20,95]},
};

function generatePalette() {
  const style = $('#aiStyle').value;
  const prompt = $('#aiPrompt').value || '科技感深色模式';
  const rules = PALETTE_RULES[style];
  const seed = hashCode(prompt);

  const colors = rules.hueShift.map((h, i) => {
    const hue = (h + (seed % 40) - 20 + 360) % 360;
    const sat = Math.min(100, Math.max(5, rules.sat[i] + (seed % 20) - 10));
    const light = Math.min(95, Math.max(5, rules.light[i] + (seed % 16) - 8));
    return hslToHex(hue, sat, light);
  });

  const roles = ['主色', '辅色', '背景', '强调色', '文字色'];
  renderPalette('aiPalette', colors, roles);
}

function renderPalette(containerId, colors, roles) {
  const c = document.getElementById(containerId);
  c.innerHTML = colors.map((hex, i) => {
    const r = roles?.[i] || '';
    const textColor = getContrastColor(hex);
    return `<div class="swatch" onclick="copyColor('${hex}')">
      <div class="color-block" style="background:${hex};display:flex;align-items:center;justify-content:center;color:${textColor};font-size:13px;font-weight:600">${r}</div>
      <div class="info"><div class="hex">${hex.toUpperCase()}</div><div class="role">${r}</div></div>
    </div>`;
  }).join('');
}

// ====== Image Color Extract ======
const extractZone = $('#extractZone');
const imageInput = $('#imageInput');
extractZone.addEventListener('click', () => imageInput.click());
imageInput.addEventListener('change', () => { if(imageInput.files[0]) extractColors(imageInput.files[0]); });
extractZone.addEventListener('dragover', e => { e.preventDefault(); extractZone.style.borderColor='var(--accent)'; });
extractZone.addEventListener('dragleave', () => { extractZone.style.borderColor=''; });
extractZone.addEventListener('drop', e => {
  e.preventDefault();
  extractZone.style.borderColor = '';
  if(e.dataTransfer.files[0]) extractColors(e.dataTransfer.files[0]);
});

async function extractColors(file) {
  const img = await createImageBitmap(file);
  const canvas = document.createElement('canvas');
  const scale = Math.min(1, 200 / Math.max(img.width, img.height));
  canvas.width = img.width * scale;
  canvas.height = img.height * scale;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
  const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;

  // Color quantization - simple bucketing
  const colorMap = {};
  for (let i = 0; i < data.length; i += 4) {
    const r = Math.round(data[i] / 32) * 32;
    const g = Math.round(data[i+1] / 32) * 32;
    const b = Math.round(data[i+2] / 32) * 32;
    if (data[i+3] < 64) continue; // Skip transparent
    const key = `${r},${g},${b}`;
    colorMap[key] = (colorMap[key] || 0) + 1;
  }

  const sorted = Object.entries(colorMap).sort((a,b) => b[1] - a[1]).slice(0, 8);
  const total = sorted.reduce((s,[,c]) => s + c, 0);

  const resultEl = $('#extractResult');
  resultEl.classList.add('show');
  resultEl.innerHTML = `
    <div class="extract-preview">
      <img src="${URL.createObjectURL(img)}" alt="预览">
    </div>
    <div class="extracted-colors">
      ${sorted.map(([rgb, count]) => {
        const [r,g,b] = rgb.split(',');
        const hex = '#' + [r,g,b].map(v=>parseInt(v).toString(16).padStart(2,'0')).join('');
        const pct = ((count/total)*100).toFixed(1);
        return `<div class="extracted-color" onclick="copyColor('${hex}')" style="cursor:pointer">
          <div class="dot" style="background:${hex}"></div>
          <span class="hex">${hex.toUpperCase()}</span>
          <span class="pct">${pct}%</span>
        </div>`;
      }).join('')}
    </div>
  `;
}

// ====== Gradient ======
$('#gFrom').addEventListener('input', updateGradient);
$('#gTo').addEventListener('input', updateGradient);

function updateGradient() {
  const from = $('#gFrom').value, to = $('#gTo').value, dir = $('#gDir').value;
  const css = `background: linear-gradient(${dir}, ${from}, ${to});`;
  $('#previewGradient').style.cssText = css;
  $('#gradientCSS').value = css;
}

// ====== Trends ======
const TRENDS = [
  {name:'暗色沉浸 + 暖色点缀',colors:['#0f172a','#1e293b','#f59e0b','#334155','#f8fafc'],desc:'2025 主流暗色设计'},
  {name:'毛玻璃 + 霓虹光',colors:['#0c0c1d','#1a1a3e','#7c3aed','#06b6d4','#fafafa'],desc:'glassmorphism 2.0'},
  {name:'新粗野主义',colors:['#fff','#000','#ff6b6b','#ffd93d','#6c5ce7'],desc:'Neo-Brutalist 标志色板'},
  {name:'复古未来主义',colors:['#1a1a2e','#16213e','#e94560','#0f3460','#f5f5f5'],desc:'80年代霓虹+赛博'},
  {name:'有机自然',colors:['#1b4332','#40916c','#52b788','#d8f3dc','#f0fdf4'],desc:'可持续设计绿色系'},
  {name:'日本极简',colors:['#fafaf9','#e7e5e4','#d6d3d1','#78716c','#292524'],desc:'Wabi-sabi 禅意配色'},
  {name:'海洋深邃',colors:['#0c4a6e','#0369a1','#0284c7','#38bdf8','#e0f2fe'],desc:'蓝调渐变层次'},
  {name:'日落暖橙',colors:['#431407','#9a3412','#ea580c','#fb923c','#fed7aa'],desc:'温暖热烈的橙色系'},
];

function renderTrends() {
  $('#trendsGrid').innerHTML = TRENDS.map(t => `
    <div class="trend-card" onclick="applyTrend('${t.name}')">
      <div class="mini-swatches">${t.colors.map(c => `<div class="mini-swatch" style="background:${c}" title="${c}"></div>`).join('')}</div>
      <div class="t-info"><div class="t-name">${t.name}</div><div class="t-desc">${t.desc}</div></div>
    </div>
  `).join('');
}

function applyTrend(name) {
  const trend = TRENDS.find(t => t.name === name);
  if (!trend) return;
  const roles = ['主色','辅色','背景','强调','文字'];
  renderPalette('aiPalette', trend.colors, roles);
  switchTab('ai');
}

// ====== Utilities ======
function hslToHex(h, s, l) {
  s /= 100; l /= 100;
  const a = s * Math.min(l, 1 - l);
  const f = n => { const k = (n + h / 30) % 12; return l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1); };
  return '#' + [f(0), f(8), f(4)].map(v => Math.round(v * 255).toString(16).padStart(2, '0')).join('');
}

function hashCode(s) { let h = 0; for (let i = 0; i < s.length; i++) h = ((h << 5) - h) + s.charCodeAt(i); return Math.abs(h); }

function getContrastColor(hex) {
  const r = parseInt(hex.slice(1,3), 16), g = parseInt(hex.slice(3,5), 16), b = parseInt(hex.slice(5,7), 16);
  return (0.299*r + 0.587*g + 0.114*b) > 150 ? '#000' : '#fff';
}

function copyColor(hex) {
  navigator.clipboard.writeText(hex.toUpperCase()).then(() => showToast(`✅ 已复制 ${hex.toUpperCase()}`));
}

function copyPalette() {
  const hexes = [...document.querySelectorAll('#aiPalette .hex')].map(e => e.textContent).join('\n');
  navigator.clipboard.writeText(hexes).then(() => showToast('✅ 色值列表已复制'));
}

function exportCSS() {
  const hexes = [...document.querySelectorAll('#aiPalette .hex')].map(e => e.textContent);
  const vars = hexes.map((h, i) => `  --color-${i+1}: ${h};`).join('\n');
  navigator.clipboard.writeText(`:root {\n${vars}\n}`).then(() => showToast('✅ CSS变量已复制'));
}

function copyGradient() {
  navigator.clipboard.writeText($('#gradientCSS').value).then(() => showToast('✅ CSS已复制'));
}

function switchTab(tab) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
  $(`#sec-${tab}`).classList.add('active');
  event.target.classList.add('active');
}

function showToast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

// Init
generatePalette();
updateGradient();
renderTrends();
</script>
