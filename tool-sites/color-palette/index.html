<script>
const $=s=>document.querySelector(s);
const RULES={modern:{h:[0,30,180,210,330],s:[60,40,70,20,80],l:[55,40,95,25,65]},dark:{h:[0,0,30,210,260],s:[10,20,80,60,90],l:[15,25,55,40,60]},warm:{h:[0,15,25,40,350],s:[80,60,40,70,50],l:[50,65,85,35,75]},cool:{h:[200,220,180,240,210],s:[50,70,40,80,30],l:[50,40,85,35,70]},vibrant:{h:[0,50,170,280,140],s:[100,90,80,95,85],l:[50,60,40,55,45]},muted:{h:[20,40,200,340,160],s:[30,25,20,35,15],l:[70,60,85,75,55]},mono:{h:[0,0,0,0,0],s:[5,10,60,30,0],l:[40,60,80,20,95]}};
const ROLES=['主色','辅色','背景','强调','文字'];

function genPalette(){
  const s=$('#aiStyle').value,p=$('#aiPrompt').value||'科技感',r=RULES[s],seed=hash(p);
  const colors=r.h.map((h,i)=>{const hue=(h+(seed%40)-20+360)%360,sat=Math.min(100,Math.max(5,r.s[i]+(seed%20)-10)),light=Math.min(95,Math.max(5,r.l[i]+(seed%16)-8));return hslHex(hue,sat,light)});
  renderPalette('aiPalette',colors,ROLES);
}
function renderPalette(id,colors,roles){
  $('#'+id).innerHTML=colors.map((c,i)=>{const r=roles?.[i]||'',tc=contrast(c);return`<div class="swatch" onclick="copyColor('${c}')"><div class="color-block" style="background:${c};color:${tc}">${r}</div><div class="info"><div class="hex">${c.toUpperCase()}</div><div class="role">${r}</div></div></div>`}).join('');
}

// Extract
const extZone=$('#extractZone'),imgInput=$('#imgInput');
extZone.addEventListener('click',()=>imgInput.click());
imgInput.addEventListener('change',()=>{if(imgInput.files[0])extract(imgInput.files[0])});
extZone.addEventListener('dragover',e=>{e.preventDefault();extZone.style.borderColor='var(--accent)'});
extZone.addEventListener('dragleave',()=>{extZone.style.borderColor=''});
extZone.addEventListener('drop',e=>{e.preventDefault();extZone.style.borderColor='';if(e.dataTransfer.files[0])extract(e.dataTransfer.files[0])});

async function extract(file){
  const img=await createImageBitmap(file);const c=document.createElement('canvas');
  const s=Math.min(1,200/Math.max(img.width,img.height));c.width=img.width*s;c.height=img.height*s;
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  const d=c.getContext('2d').getImageData(0,0,c.width,c.height).data,map={};
  for(let i=0;i<d.length;i+=4){const r=Math.round(d[i]/32)*32,g=Math.round(d[i+1]/32)*32,b=Math.round(d[i+2]/32)*32;if(d[i+3]<64)continue;const k=`${r},${g},${b}`;map[k]=(map[k]||0)+1}
  const sorted=Object.entries(map).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const total=sorted.reduce((s,[,c])=>s+c,0);
  const el=$('#extractResult');el.classList.add('show');
  el.innerHTML=`<div class="extract-preview"><img src="${URL.createObjectURL(img)}"></div><div class="extracted-list">${sorted.map(([rgb,cnt])=>{const[r,g,b]=rgb.split(',');const hex='#'+[r,g,b].map(v=>parseInt(v).toString(16).padStart(2,'0')).join('');return`<div class="extracted-item" onclick="copyColor('${hex}')"><div class="dot" style="background:${hex}"></div><span class="hex">${hex.toUpperCase()}</span><span class="pct">${((cnt/total)*100).toFixed(1)}%</span></div>`}).join('')}</div>`;
}

// Gradient
$('#gFrom').addEventListener('input',upGrad);$('#gTo').addEventListener('input',upGrad);
function upGrad(){const f=$('#gFrom').value,t=$('#gTo').value,d=$('#gDir').value,css=`linear-gradient(${d}, ${f}, ${t})`;$('#gradPreview').style.background=css;$('#gradCSS').value=`background: ${css};`}

// Trends
const TRENDS=[{name:'暗色沉浸',colors:['#0f172a','#1e293b','#f59e0b','#334155','#f8fafc'],desc:'2025 暗色设计主流'},{name:'毛玻璃霓虹',colors:['#0c0c1d','#1a1a3e','#7c3aed','#06b6d4','#fafafa'],desc:'glassmorphism 2.0'},{name:'新粗野主义',colors:['#fff','#000','#ff6b6b','#ffd93d','#6c5ce7'],desc:'Neo-Brutalist'},{name:'复古未来',colors:['#1a1a2e','#16213e','#e94560','#0f3460','#f5f5f5'],desc:'80s 霓虹赛博'},{name:'有机自然',colors:['#1b4332','#40916c','#52b788','#d8f3dc','#f0fdf4'],desc:'可持续绿色系'},{name:'日本极简',colors:['#fafaf9','#e7e5e4','#d6d3d1','#78716c','#292524'],desc:'Wabi-sabi 禅意'},{name:'海洋深邃',colors:['#0c4a6e','#0369a1','#0284c7','#38bdf8','#e0f2fe'],desc:'蓝调渐变层次'},{name:'日落暖橙',colors:['#431407','#9a3412','#ea580c','#fb923c','#fed7aa'],desc:'温暖橙色系'}];
function renderTrends(){$('#trendsGrid').innerHTML=TRENDS.map(t=>`<div class="trend-card" onclick="applyTrend('${t.name}')"><div class="mini-row">${t.colors.map(c=>`<div style="background:${c}"></div>`).join('')}</div><div class="t-info"><div class="t-name">${t.name}</div><div class="t-desc">${t.desc}</div></div></div>`).join('')}
function applyTrend(n){const t=TRENDS.find(x=>x.name===n);if(!t)return;renderPalette('aiPalette',t.colors,ROLES);switchTab('ai')}

// Utils
function hslHex(h,s,l){s/=100;l/=100;const a=s*Math.min(l,1-l),f=n=>{const k=(n+h/30)%12;return l-a*Math.max(Math.min(k-3,9-k,1),-1)};return'#'+[f(0),f(8),f(4)].map(v=>Math.round(v*255).toString(16).padStart(2,'0')).join('')}
function hash(s){let h=0;for(let i=0;i<s.length;i++)h=((h<<5)-h)+s.charCodeAt(i);return Math.abs(h)}
function contrast(hex){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return(.299*r+.587*g+.114*b)>150?'#000':'#fff'}
function copyColor(h){navigator.clipboard.writeText(h.toUpperCase()).then(()=>toast('已复制 '+h.toUpperCase()))}
function copyPalette(){const h=[...document.querySelectorAll('#aiPalette .hex')].map(e=>e.textContent).join('\n');navigator.clipboard.writeText(h).then(()=>toast('色值已复制'))}
function exportCSS(){const h=[...document.querySelectorAll('#aiPalette .hex')].map(e=>e.textContent);navigator.clipboard.writeText(`:root {\n${h.map((x,i)=>`  --color-${i+1}: ${x};`).join('\n')}\n}`).then(()=>toast('CSS 已复制'))}
function copyGrad(){navigator.clipboard.writeText($('#gradCSS').value).then(()=>toast('CSS 已复制'))}
function switchTab(t){document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));$('#sec-'+t).classList.add('active');event.target.classList.add('active')}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000)}
genPalette();upGrad();renderTrends();
</script>
