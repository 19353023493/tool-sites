<main><h1>📐 图片缩放裁切</h1><p class="subtitle">按像素或百分比调整图片尺寸，支持锁定比例</p>
<div class="ad-banner">📢 广告位 — Google AdSense</div>
<details class="guide"><summary>使用说明 · 点击展开</summary><div class="guide-content"><p><strong>🎯 什么时候用？</strong><br>头像要改尺寸、证件照要缩到指定像素、网店图片要统一尺寸、截图太大要缩小。</p><p><strong>📖 怎么用？</strong><br>上传图片→输入目标宽高（或百分比）→勾选"锁定比例"自动算另一边→预览→下载。</p></div></details>
<div class="tool-panel"><label>上传图片</label><div class="file-zone" id="dropZone"><input type="file" id="fileInput" accept="image/*" onchange="handleFile(this)"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="display:block;margin:0 auto 6px"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/></svg>拖拽或点击上传图片</div></div>
<div class="tool-panel"><label>缩放设置</label><div class="row"><div><label>宽度 (px)</label><input type="number" id="newWidth" min="1" max="8000" oninput="calcSize('w')"></div><div><label>高度 (px)</label><input type="number" id="newHeight" min="1" max="8000" oninput="calcSize('h')"></div></div><div class="row" style="margin-top:10px"><label style="display:flex;align-items:center;gap:6px;font-size:13px"><input type="checkbox" id="lockRatio" checked onchange="calcSize()"> 锁定比例</label><div><label>输出格式</label><select id="format"><option value="image/png">PNG</option><option value="image/jpeg">JPG</option><option value="image/webp">WebP</option></select></div></div><div class="btn-row"><button class="btn-primary" onclick="resizeImage()">缩放图片</button></div></div>
<div class="tool-panel"><div class="preview" id="preview"><p style="color:var(--muted)">上传图片并设置尺寸</p></div><div class="stats" id="stats"></div><div class="btn-row"><button class="btn-primary" id="downloadBtn" style="display:none" onclick="downloadResized()">下载图片</button></div></div>

<script>const $=s=>document.querySelector(s);let currentBlob=null,originalImg=null,origW=0,origH=0;
function handleFile(inp){const f=inp.files[0];if(!f)return;const reader=new FileReader();reader.onload=()=>{originalImg=new Image();originalImg.onload=()=>{origW=originalImg.width;origH=originalImg.height;$('#newWidth').value=origW;$('#newHeight').value=origH;$('#stats').textContent=`原始：${origW}×${origH}px`;resizeImage()};originalImg.src=reader.result};reader.readAsDataURL(f)}
function calcSize(from){const lock=$('#lockRatio').checked;if(!lock||!origW)return;const ratio=origW/origH;if(from==='w'){$('#newHeight').value=Math.round(parseInt($('#newWidth').value)/ratio)}else{$('#newWidth').value=Math.round(parseInt($('#newHeight').value)*ratio)}resizeImage()}
function resizeImage(){if(!originalImg){return}const w=parseInt($('#newWidth').value)||origW;const h=parseInt($('#newHeight').value)||origH;if(w<1||h<1||w>8000||h>8000){toast('尺寸需在1-8000之间');return}const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;const ctx=canvas.getContext('2d');ctx.drawImage(originalImg,0,0,w,h);const fmt=$('#format').value;canvas.toBlob(blob=>{currentBlob=blob;$('#preview').innerHTML=`<img src="${URL.createObjectURL(blob)}" alt="预览">`;$('#stats').innerHTML=`原始：${origW}×${origH}px → 缩放：${w}×${h}px · ${(blob.size/1024).toFixed(1)} KB`;$('#downloadBtn').style.display='inline-flex'},fmt,0.9)}
function downloadResized(){if(!currentBlob){toast('请先缩放图片');return}const a=document.createElement('a');const ext={'image/png':'png','image/jpeg':'jpg','image/webp':'webp'}[$('#format').value];a.href=URL.createObjectURL(currentBlob);a.download='resized.'+ext;a.click();toast('已下载')}
['dragover','drop'].forEach(ev=>{$('#dropZone').addEventListener(ev,e=>{e.preventDefault();if(ev==='drop'){$('#fileInput').files=e.dataTransfer.files;handleFile($('#fileInput'))}$('#dropZone').style.borderColor=ev==='dragover'?'var(--accent)':''})})
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500)}</script>
