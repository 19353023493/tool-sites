<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>在线图片压缩 — 免费压缩PNG/JPG/WebP</title>
<meta name="description" content="免费在线图片压缩，拖拽上传，智能调节质量。纯浏览器端处理，图片不上传服务器。">
<meta name="keywords" content="图片压缩,在线压缩,PNG压缩,JPG压缩,WebP压缩">
<link rel="canonical" href="https://image-compress.vercel.app">
<style>
:root{
  --bg:#f9f8f6;--surface:#fff;--border:#e8e5de;--text:#2c2c28;--muted:#8b8b7e;
  --accent:#2d8a6e;--accent-hover:#1f6d55;--red:#c0392b;
  --radius:14px;--radius-sm:10px;
  --shadow:0 1px 3px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.03);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-font-smoothing:antialiased}
body{
  font-family:Georgia,"Noto Serif SC",serif;background:var(--bg);color:var(--text);line-height:1.7;min-height:100vh;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.02'/%3E%3C/svg%3E");
}
/* Nav */
nav{
  position:sticky;top:0;z-index:100;background:rgba(249,248,246,.85);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);padding:14px 28px;
  display:flex;align-items:center;gap:24px;flex-wrap:wrap;
}
nav .brand{font-weight:700;font-size:16px;color:var(--accent);text-decoration:none;font-family:"PingFang SC","Microsoft YaHei",sans-serif}
nav .brand:hover{opacity:.8}
nav .links{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
nav .links a{font-family:"PingFang SC","Microsoft YaHei",sans-serif;color:var(--muted);text-decoration:none;font-size:13px;padding:6px 12px;border-radius:8px;transition:all .2s}
nav .links a:hover{color:var(--text);background:rgba(0,0,0,.03)}
nav .links a.active{color:var(--accent);background:#eaf5ef;font-weight:600}
/* Main */
main{max-width:800px;margin:0 auto;padding:32px 24px}
/* Upload card */
.upload-card{
  background:var(--surface);border:2px dashed var(--border);border-radius:var(--radius);
  padding:56px 32px;text-align:center;cursor:pointer;transition:all .25s;box-shadow:var(--shadow);
}
.upload-card:hover,.upload-card.drag{border-color:var(--accent);background:#fafdfb;box-shadow:0 0 0 4px rgba(45,138,110,.06)}
.upload-card .upload-icon{font-size:44px;margin-bottom:14px}
.upload-card h2{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:18px;font-weight:600;margin-bottom:6px}
.upload-card .hint{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;color:var(--muted)}
.upload-card input{display:none}
/* File info */
.file-info{display:none;margin-top:20px}
.file-info.show{display:block}
.file-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;box-shadow:var(--shadow);
}
.file-card img.preview{width:72px;height:72px;border-radius:8px;object-fit:cover;background:#f0ede6}
.file-card .f-detail{flex:1;min-width:160px;font-family:"PingFang SC","Microsoft YaHei",sans-serif}
.file-card .f-name{font-size:15px;font-weight:600;word-break:break-all}
.file-card .f-size{font-size:13px;color:var(--muted);margin-top:3px}
.file-card .f-remove{
  background:none;border:1px solid var(--border);color:var(--muted);padding:7px 18px;border-radius:20px;
  cursor:pointer;font-size:13px;font-family:"PingFang SC","Microsoft YaHei",sans-serif;transition:all .2s;
}
.file-card .f-remove:hover{color:var(--red);border-color:var(--red)}
/* Controls card */
.controls-card{display:none;margin-top:18px}
.controls-card.show{display:block}
.control-panel{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:24px;box-shadow:var(--shadow);
}
.control-panel label{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;font-weight:600;display:block;margin-bottom:10px}
.control-panel input[type=range]{width:100%;accent-color:var(--accent);height:6px}
.range-labels{display:flex;justify-content:space-between;font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:12px;color:var(--muted);margin-top:4px}
.format-row{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.format-btn{
  flex:1;min-width:80px;padding:10px 14px;text-align:center;font-family:"PingFang SC","Microsoft YaHei",sans-serif;
  font-size:14px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);
  cursor:pointer;transition:all .2s;
}
.format-btn:hover{border-color:var(--accent)}
.format-btn.active{background:#eaf5ef;border-color:var(--accent);color:var(--accent);font-weight:600}
/* Buttons */
.btn{
  display:block;width:100%;padding:14px;border:none;border-radius:var(--radius-sm);font-size:16px;
  font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-weight:600;cursor:pointer;transition:all .2s;
}
.btn-compress{margin-top:18px;background:var(--accent);color:#fff}
.btn-compress:hover{background:var(--accent-hover)}
.btn-compress:disabled{opacity:.4;cursor:not-allowed}
/* Result */
.result-area{display:none;margin-top:18px}
.result-area.show{display:block}
.result-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:24px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;box-shadow:var(--shadow);
}
.result-card img.result-preview{width:100px;height:100px;border-radius:8px;object-fit:cover;background:#f0ede6}
.result-card .r-stats{flex:1;min-width:180px;font-family:"PingFang SC","Microsoft YaHei",sans-serif}
.result-card .r-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #f4f2ed;font-size:14px}
.result-card .r-row span:first-child{color:var(--muted)}
.result-card .r-row span:last-child{font-weight:600}
.result-card .r-saved{color:var(--accent)}
.btn-download{margin-top:14px;background:var(--text);color:#fff}
.btn-download:hover{background:#000}
/* Toast */
.toast{
  position:fixed;top:24px;left:50%;transform:translateX(-50%);z-index:999;
  background:var(--text);color:#fff;padding:12px 28px;border-radius:24px;
  font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;font-weight:600;
  opacity:0;transition:opacity .3s;pointer-events:none;
}
.toast.show{opacity:1}
/* Ad */
.ad-banner{max-width:800px;margin:20px auto;padding:14px;text-align:center;font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:13px;color:var(--muted);background:var(--surface);border:1px dashed var(--border);border-radius:var(--radius)}
/* Footer */
footer{text-align:center;padding:36px 24px;border-top:1px solid var(--border);margin-top:48px}
footer p{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:13px;color:var(--muted)}
footer a{color:var(--accent);text-decoration:none}
footer a:hover{text-decoration:underline}
.footer-links{display:flex;gap:20px;justify-content:center;flex-wrap:wrap;margin:12px 0}
</style>

<body>

<nav>
  <a href="../index.html" class="brand">← 工具站</a>
  <div class="links">
    <a href="../image-compressor/" class="active">图片压缩</a>
    <a href="../json-formatter/">JSON 工具</a>
    <a href="../color-palette/">配色方案</a>
  </div>
</nav>

<main>
  <div class="upload-card" id="uploadZone">
    <div class="upload-icon"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg></div>
    <h2>点击上传或拖拽图片到此处</h2>
    <p class="hint">支持 PNG · JPG · WebP · 单张最大 20MB</p>
    <input type="file" id="fileInput" accept="image/png,image/jpeg,image/webp">
  </div>

  <div class="ad-banner">📢 广告位 — 百度联盟</div>

  <div class="file-info" id="fileInfo"></div>

  <div class="controls-card" id="controlsCard">
    <div class="control-panel">
      <label>压缩质量 · <strong id="qualityLabel">80%</strong></label>
      <input type="range" id="quality" min="10" max="100" value="80" step="5">
      <div class="range-labels"><span>高压缩 / 小文件</span><span>高质量 / 大文件</span></div>
      <div style="margin-top:20px">
        <label style="margin-bottom:10px">输出格式</label>
        <div class="format-row" id="formatRow">
          <button class="format-btn active" data-format="auto">保持原格式</button>
          <button class="format-btn" data-format="image/jpeg">JPG</button>
          <button class="format-btn" data-format="image/png">PNG</button>
          <button class="format-btn" data-format="image/webp">WebP</button>
        </div>
      </div>
    </div>
    <button class="btn btn-compress" id="compressBtn" disabled>开始压缩</button>
    <div class="result-area" id="resultArea"></div>
  </div>

  <div class="ad-banner">📢 广告位 — 百度联盟</div>
</main>

<footer>
  <div class="footer-links">
    <a href="../privacy.html">隐私政策</a>
    <a href="../json-formatter/">JSON 工具</a>
    <a href="../color-palette/">配色方案</a>
    <a href="../index.html">更多工具</a>
  </div>
  <p>© 2025 在线工具站 · 图片不上传服务器</p>
</footer>

<div class="toast" id="toast"></div>

<script>
const $=s=>document.querySelector(s);
const $$=(s)=>document.querySelectorAll(s);
const uploadZone=$('#uploadZone'),fileInput=$('#fileInput'),fileInfo=$('#fileInfo');
const controlsCard=$('#controlsCard'),compressBtn=$('#compressBtn');
const resultArea=$('#resultArea'),quality=$('#quality'),qualityLabel=$('#qualityLabel');
let originalFile=null,outputFormat='auto';

uploadZone.addEventListener('click',()=>fileInput.click());
uploadZone.addEventListener('dragover',e=>{e.preventDefault();uploadZone.classList.add('drag')});
uploadZone.addEventListener('dragleave',()=>uploadZone.classList.remove('drag'));
uploadZone.addEventListener('drop',e=>{e.preventDefault();uploadZone.classList.remove('drag');if(e.dataTransfer.files[0])handleFile(e.dataTransfer.files[0])});
fileInput.addEventListener('change',()=>{if(fileInput.files[0])handleFile(fileInput.files[0])});

function handleFile(file){
  if(!file.type.match(/image\/(png|jpeg|webp)/)){toast('仅支持 PNG / JPG / WebP');return}
  if(file.size>20*1024*1024){toast('文件不能超过 20MB');return}
  originalFile=file;
  const r=new FileReader();
  r.onload=e=>{fileInfo.innerHTML=`<div class="file-card show"><img class="preview" src="${e.target.result}"><div class="f-detail"><div class="f-name">${file.name}</div><div class="f-size">${fmtSize(file.size)} · ${file.type}</div></div><button class="f-remove" onclick="resetAll()">✕ 移除</button></div>`;fileInfo.classList.add('show')};
  r.readAsDataURL(file);
  controlsCard.classList.add('show');compressBtn.disabled=false;resultArea.classList.remove('show');
}

$$('#formatRow .format-btn').forEach(b=>b.addEventListener('click',function(){$$('#formatRow .format-btn').forEach(x=>x.classList.remove('active'));this.classList.add('active');outputFormat=this.dataset.format}));
quality.addEventListener('input',function(){qualityLabel.textContent=this.value+'%'});

compressBtn.addEventListener('click',async()=>{
  if(!originalFile)return;
  compressBtn.disabled=true;compressBtn.textContent='压缩中...';
  try{
    const img=await createImageBitmap(originalFile);
    const c=document.createElement('canvas');c.width=img.width;c.height=img.height;
    c.getContext('2d').drawImage(img,0,0);
    const fmt=outputFormat==='auto'?originalFile.type:outputFormat;
    const blob=await new Promise(r=>c.toBlob(r,fmt,parseInt(quality.value)/100));
    const url=URL.createObjectURL(blob);
    const ratio=((1-blob.size/originalFile.size)*100).toFixed(1);
    const ext=fmt.split('/')[1];
    resultArea.innerHTML=`<div class="result-card show"><img class="result-preview" src="${url}"><div class="r-stats"><div class="r-row"><span>原始</span><span>${fmtSize(originalFile.size)}</span></div><div class="r-row"><span>压缩后</span><span>${fmtSize(blob.size)}</span></div><div class="r-row"><span>节省</span><span class="r-saved">${ratio}% (${fmtSize(originalFile.size-blob.size)})</span></div><div class="r-row"><span>格式</span><span>${ext.toUpperCase()} · ${img.width}×${img.height}</span></div></div></div><button class="btn btn-download" onclick="downloadResult('${url}','${originalFile.name.replace(/\.[^.]+$/,'')}_compressed.${ext}')">下载压缩后的图片</button>`;
    resultArea.classList.add('show');compressBtn.textContent='重新压缩';compressBtn.disabled=false;
    toast(`节省了 ${ratio}%`);
  }catch(e){toast('压缩失败: '+e.message);compressBtn.textContent='开始压缩';compressBtn.disabled=false}
});

function downloadResult(url,name){const a=document.createElement('a');a.href=url;a.download=name;a.click()}
function resetAll(){originalFile=null;fileInput.value='';fileInfo.classList.remove('show');controlsCard.classList.remove('show');resultArea.classList.remove('show');compressBtn.disabled=true;compressBtn.textContent='开始压缩'}
function fmtSize(b){return b<1024?b+' B':b<1048576?(b/1024).toFixed(1)+' KB':(b/1048576).toFixed(2)+' MB'}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500)}
</script>
</body>
