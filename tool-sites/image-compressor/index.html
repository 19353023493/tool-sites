/* Controls */

.controls .format-btn:hover,.controls .format-btn.active{border-color:var(--accent);background:rgba(59,130,246,.1)}
/* Result */

/* Compress button */
.compress-btn{display:block;width:100%;padding:14px;background:var(--green);color:#000;border:none;border-radius:var(--radius);font-size:16px;font-weight:600;cursor:pointer;margin-top:16px;transition:all .2s}

/* Footer */
footer{text-align:center;padding:32px 24px;color:var(--text-muted);font-size:13px;border-top:1px solid rgba(255,255,255,.06);margin-top:40px}

<main>
  <div class="upload-zone" id="uploadZone">
    <div class="icon">📁</div>
    <div class="title">点击上传或拖拽图片到此处</div>
    <div class="sub">支持 PNG · JPG · WebP · 单张最大 20MB</div>

  </div>

    <div class="file-info" id="fileInfo"></div>
    <div class="controls">
      <label>压缩质量: <strong id="qualityLabel">80%</strong></label>
      <input type="range" id="quality" min="10" max="100" value="80" step="5">
      <div class="range-labels"><span>高压缩/小文件</span><span>高质量/大文件</span></div>
      <div style="margin-top:16px">
        <label>输出格式</label>
        <div class="format-select" id="formatSelect">
          <button class="format-btn active" data-format="auto">自动(保持原格式)</button>
          <button class="format-btn" data-format="image/jpeg">JPG</button>
          <button class="format-btn" data-format="image/png">PNG</button>
          <button class="format-btn" data-format="image/webp">WebP</button>
        </div>
      </div>
    </div>
    <button class="compress-btn" id="compressBtn" disabled>🔧 开始压缩</button>
    <div class="result-area" id="resultArea"></div>
  </div>
</main>

<div class="ad-banner">📢 广告位 — 百度联盟（你的广告代码放这里）</div>

</footer>

<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);

let originalFile = null;
let outputFormat = 'auto';

// Upload handling
const uploadZone = $('#uploadZone');
const fileInput = $('#fileInput');

uploadZone.addEventListener('click', () => fileInput.click());
uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.classList.add('drag-over'); });
uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('drag-over'));
uploadZone.addEventListener('drop', e => {
  e.preventDefault();
  uploadZone.classList.remove('drag-over');
  if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', () => {
  if (fileInput.files.length) handleFile(fileInput.files[0]);
});

function handleFile(file) {
  if (!file.type.match(/image\/(png|jpeg|webp)/)) {
    showToast('❌ 仅支持 PNG / JPG / WebP 格式');
    return;
  }
  if (file.size > 20 * 1024 * 1024) {
    showToast('❌ 文件大小不能超过 20MB');
    return;
  }
  originalFile = file;
  renderFileInfo(file);
  $('#previewArea').classList.add('show');
  $('#compressBtn').disabled = false;
  $('#resultArea').classList.remove('show');
}

function renderFileInfo(file) {
  const reader = new FileReader();
  reader.onload = e => {
    $('#fileInfo').innerHTML = `
      <img class="thumb" src="${e.target.result}" alt="预览">
      <div class="detail">
        <div class="name">${file.name}</div>
        <div class="size">原始大小: ${formatSize(file.size)} · ${file.type}</div>
      </div>
      <button class="remove-btn" onclick="resetAll()">✕ 移除</button>
    `;
  };
  reader.readAsDataURL(file);
}

// Format selection
$$('#formatSelect .format-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    $$('#formatSelect .format-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    outputFormat = btn.dataset.format;
  });
});

// Quality slider
$('#quality').addEventListener('input', function() {
  $('#qualityLabel').textContent = this.value + '%';
});

// Compress
$('#compressBtn').addEventListener('click', async () => {
  if (!originalFile) return;
  const btn = $('#compressBtn');
  btn.disabled = true;
  btn.textContent = '⏳ 压缩中...';

  try {
    const quality = parseInt($('#quality').value) / 100;
    const img = await createImageBitmap(originalFile);
    const canvas = document.createElement('canvas');
    canvas.width = img.width;
    canvas.height = img.height;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0);

    const format = outputFormat === 'auto' ? originalFile.type : outputFormat;
    const blob = await new Promise(r => canvas.toBlob(r, format, quality));
    const url = URL.createObjectURL(blob);

    const ratio = ((1 - blob.size / originalFile.size) * 100).toFixed(1);
    const saved = originalFile.size - blob.size;

    $('#resultArea').innerHTML = `
      <div class="result-card">
        <img class="preview-img" src="${url}" alt="压缩结果">
        <div class="stats">
          <div class="row"><span>原始大小</span><span>${formatSize(originalFile.size)}</span></div>
          <div class="row"><span>压缩后</span><span>${formatSize(blob.size)}</span></div>
          <div class="row"><span>节省</span><span class="saved">${formatSize(Math.abs(saved))} (${ratio}%)</span></div>
          <div class="row"><span>输出格式</span><span>${format.split('/')[1].toUpperCase()}</span></div>
          <div class="row"><span>分辨率</span><span>${img.width} × ${img.height}</span></div>
        </div>
      </div>
      <button class="download-btn" onclick="downloadResult('${url}', '${originalFile.name.replace(/\.[^.]+$/, '')}_compressed.${format.split('/')[1]}')">⬇ 下载压缩后的图片</button>
    `;
    $('#resultArea').classList.add('show');
    btn.textContent = '✅ 压缩完成，点击重新压缩';
    btn.disabled = false;
    showToast(`✅ 压缩完成！节省了 ${ratio}%`);
  } catch(e) {
    showToast('❌ 压缩失败: ' + e.message);
    btn.textContent = '🔧 开始压缩';
    btn.disabled = false;
  }
});

function downloadResult(url, filename) {
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.click();
}

function resetAll() {
  originalFile = null;
  fileInput.value = '';
  $('#previewArea').classList.remove('show');
  $('#resultArea').classList.remove('show');
  $('#compressBtn').disabled = true;
  $('#compressBtn').textContent = '🔧 开始压缩';
}

function formatSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / 1048576).toFixed(2) + ' MB';
}

function showToast(msg) {
  const toast = $('#toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2500);
}
</script>
