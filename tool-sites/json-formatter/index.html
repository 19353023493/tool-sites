<style>
:root{
  --bg:#f9f8f6;--surface:#fff;--border:#e8e5de;--text:#2c2c28;--muted:#8b8b7e;
  --accent:#4f6d8c;--accent-hover:#385374;--red:#c0392b;--green:#2d8a6e;
  --radius:14px;--radius-sm:10px;
  --shadow:0 1px 3px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.03);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-font-smoothing:antialiased}
body{font-family:"SF Mono","Fira Code","JetBrains Mono",Consolas,monospace;background:var(--bg);color:var(--text);line-height:1.7;min-height:100vh;font-size:13px;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.02'/%3E%3C/svg%3E");
}
nav{
  position:sticky;top:0;z-index:100;background:rgba(249,248,246,.85);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);padding:14px 28px;
  display:flex;align-items:center;gap:24px;flex-wrap:wrap;
}
nav .brand{font-weight:700;font-size:15px;color:var(--accent);text-decoration:none;font-family:"PingFang SC","Microsoft YaHei",sans-serif}
nav .brand:hover{opacity:.8}
nav .links{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
nav .links a{font-family:"PingFang SC","Microsoft YaHei",sans-serif;color:var(--muted);text-decoration:none;font-size:13px;padding:6px 12px;border-radius:8px;transition:all .2s}
nav .links a:hover{color:var(--text);background:rgba(0,0,0,.03)}
nav .links a.active{color:var(--accent);background:#eef2f7;font-weight:600}
main{max-width:1100px;margin:0 auto;padding:24px}
/* Toolbar */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.toolbar button{
  font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:13px;
  padding:8px 16px;border:1px solid var(--border);border-radius:8px;
  background:var(--surface);color:var(--text);cursor:pointer;transition:all .2s;
}
.toolbar button:hover{border-color:var(--accent)}
.toolbar button.active{background:#eef2f7;border-color:var(--accent);color:var(--accent);font-weight:600}
.toolbar .sep{width:1px;background:var(--border);margin:0 4px}
/* Editor grid */
.editor-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:720px){.editor-grid{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.panel-header{
  padding:11px 18px;font-family:"PingFang SC","Microsoft YaHei",sans-serif;
  font-size:12px;color:var(--muted);border-bottom:1px solid var(--border);
  display:flex;justify-content:space-between;align-items:center;background:#fcfbf9;
}
textarea{
  flex:1;width:100%;padding:18px;border:none;background:transparent;
  color:var(--text);font-family:inherit;font-size:13px;line-height:1.7;resize:none;outline:none;tab-size:2;
  min-height:420px;
}
textarea:focus{background:#fdfcf9}
.error-msg{display:none;padding:10px 18px;background:#fef5f5;color:var(--red);font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:12px;border-top:1px solid #fdd}
.error-msg.show{display:block}
.tree-view{display:none;flex:1;overflow:auto;padding:18px;font-size:13px;line-height:1.9}
.tree-view.show{display:block}
.tree-view .key{color:#7c5aa8}
.tree-view .string{color:#2d8a6e}
.tree-view .number{color:#d4853c}
.tree-view .boolean{color:#4f6d8c}
.tree-view .null{color:#c0392b}
.tree-view .bracket{color:var(--muted)}
.tree-view .toggle{cursor:pointer;user-select:none;margin-right:5px;color:var(--muted)}
.csv-table{display:none;flex:1;overflow:auto}
.csv-table.show{display:block}
.csv-table table{width:100%;border-collapse:collapse;font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:12px}
.csv-table th{background:#fcfbf9;padding:10px 14px;text-align:left;font-weight:600;position:sticky;top:0;z-index:1;border-bottom:2px solid var(--accent)}
.csv-table td{padding:8px 14px;border-bottom:1px solid #f4f2ed;max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.csv-table tr:hover td{background:#fdfcfa}
/* Stats */
.stats-bar{display:flex;gap:14px;margin-top:14px;font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:12px;color:var(--muted);flex-wrap:wrap}
.stats-bar span{padding:6px 14px;background:var(--surface);border:1px solid var(--border);border-radius:6px}
/* Toast */
.toast{position:fixed;top:24px;left:50%;transform:translateX(-50%);z-index:999;background:var(--text);color:#fff;padding:12px 28px;border-radius:24px;font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;font-weight:600;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
/* Ad */
.ad-banner{max-width:1100px;margin:18px auto;padding:14px;text-align:center;font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:13px;color:var(--muted);background:var(--surface);border:1px dashed var(--border);border-radius:var(--radius)}
footer{text-align:center;padding:36px 24px;border-top:1px solid var(--border);margin-top:48px}
footer p{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:13px;color:var(--muted)}
footer a{color:var(--accent);text-decoration:none}
footer a:hover{text-decoration:underline}
.footer-links{display:flex;gap:20px;justify-content:center;flex-wrap:wrap;margin:12px 0}
</style>
</head>
<body>

<nav>
  <a href="../index.html" class="brand">← 工具站</a>
  <div class="links">
    <a href="../image-compressor/">图片压缩</a>
    <a href="../json-formatter/" class="active">JSON 工具</a>
    <a href="../color-palette/">配色方案</a>
  </div>
</nav>

<main>
  <div class="toolbar">
    <button class="active" data-mode="format">格式化</button>
    <button data-mode="minify">压缩</button>
    <button data-mode="validate">校验</button>
    <button data-mode="tree">树形</button>
    <button data-mode="csv">CSV</button>
    <span class="sep"></span>
    <button onclick="copyOutput()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:3px"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>复制
    </button>
    <button onclick="clearAll()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:3px"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>清空
    </button>
    <button onclick="loadSample()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:3px"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>示例
    </button>
  </div>

  <div class="ad-banner">📢 广告位 — 百度联盟</div>

  <div class="editor-grid">
    <div class="panel">
      <div class="panel-header"><span>输入 JSON</span><span id="inputCount">0 字符</span></div>
      <textarea id="input" placeholder='粘贴 JSON 到这里... 例如: {"name":"张三","age":25}'></textarea>
      <div class="error-msg" id="errorMsg"></div>
    </div>
    <div class="panel">
      <div class="panel-header"><span id="outputLabel">格式化输出</span><span id="outputCount">0 字符</span></div>
      <textarea id="output" readonly placeholder="处理结果将显示在这里..."></textarea>
      <div class="tree-view" id="treeView"></div>
      <div class="csv-table" id="csvTable"></div>
    </div>
  </div>

  <div class="stats-bar" id="statsBar"></div>
</main>

<div class="ad-banner" style="max-width:1100px">📢 广告位 — 百度联盟</div>

<footer>
  <div class="footer-links">
    <a href="../privacy.html">隐私政策</a>
    <a href="../image-compressor/">图片压缩</a>
    <a href="../color-palette/">配色方案</a>
    <a href="../index.html">更多工具</a>
  </div>
  <p>© 2025 在线工具站 · 数据不上传服务器</p>
</footer>

<div class="toast" id="toast"></div>

<script>
const $=s=>document.querySelector(s);
let currentMode='format',parsedData=null;
const input=$('#input'),output=$('#output'),errorMsg=$('#errorMsg'),treeView=$('#treeView'),csvTable=$('#csvTable');

input.addEventListener('input',process);
input.addEventListener('paste',()=>setTimeout(process,10));

function process(){
  const val=input.value.trim();
  $('#inputCount').textContent=val.length+' 字符';
  errorMsg.classList.remove('show');hideOutputs();
  if(!val){output.value='';$('#outputCount').textContent='0 字符';$('#statsBar').innerHTML='';parsedData=null;return}
  try{
    parsedData=JSON.parse(val);
    switch(currentMode){
      case'format':format();break;case'minify':minify();break;
      case'validate':validate();break;case'tree':tree();break;case'csv':toCSV();break;
    }
    stats();
  }catch(e){errorMsg.textContent='JSON 语法错误: '+e.message;errorMsg.classList.add('show');output.value='';$('#outputCount').textContent='—';parsedData=null}
}

function hideOutputs(){output.style.display='block';treeView.classList.remove('show');csvTable.classList.remove('show');output.value=''}
function format(){hideOutputs();output.style.display='block';output.value=JSON.stringify(parsedData,null,2);$('#outputCount').textContent=output.value.length+' 字符'}
function minify(){hideOutputs();output.style.display='block';output.value=JSON.stringify(parsedData);$('#outputCount').textContent=output.value.length+' 字符'}
function validate(){hideOutputs();output.style.display='block';const t=Array.isArray(parsedData)?'数组':typeof parsedData==='object'?'对象':typeof parsedData;const k=typeof parsedData==='object'&&parsedData?Object.keys(parsedData).length:0;output.value=`✅ 格式正确\n\n类型: ${t}\n${k?'键数: '+k:''}\n大小: ${new Blob([input.value]).size} bytes`;$('#outputCount').textContent='—'}
function tree(){output.style.display='none';treeView.classList.add('show');treeView.innerHTML='<div>'+buildNode(parsedData,'',true)+'</div>'}
function buildNode(v,k,last){
  if(v===null)return`<span class="key">${k?'"'+k+'"':''}</span><span class="bracket">:</span> <span class="null">null</span>\n`;
  if(typeof v==='boolean')return`<span class="key">${k?'"'+k+'"':''}</span><span class="bracket">:</span> <span class="boolean">${v}</span>\n`;
  if(typeof v==='number')return`<span class="key">${k?'"'+k+'"':''}</span><span class="bracket">:</span> <span class="number">${v}</span>\n`;
  if(typeof v==='string')return`<span class="key">${k?'"'+k+'"':''}</span><span class="bracket">:</span> <span class="string">"${v.replace(/</g,'&lt;')}"</span>\n`;
  const isA=Array.isArray(v),entries=isA?v.map((x,i)=>[i,x]):Object.entries(v);
  const br=isA?['[',']']:['{','}'];
  const id='t_'+Math.random().toString(36).slice(2,8);
  let h=`<span class="toggle" onclick="toggle('${id}')">▼</span><span class="key">${k?'"'+k+'"':''}</span><span class="bracket">${k?': ':''}${br[0]} (${entries.length})</span>\n`;
  h+=`<div id="${id}" style="padding-left:22px">`;
  entries.forEach(([kk,vv],i)=>h+=buildNode(vv,isA?kk:kk,i===entries.length-1));
  h+=`</div><span class="bracket">${br[1]}</span>\n`;
  return h;
}
function toggle(id){const e=document.getElementById(id);if(!e)return;const t=e.previousElementSibling;e.style.display=e.style.display==='none'?'block':'none';t.textContent=e.style.display==='none'?'▶':'▼'}
function toCSV(){output.style.display='none';csvTable.classList.add('show');const arr=Array.isArray(parsedData)?parsedData:[parsedData];if(!arr.length||typeof arr[0]!=='object'||arr[0]===null){csvTable.innerHTML='<div style="padding:18px;color:#c0392b;font-family:PingFang SC,Microsoft YaHei,sans-serif">⚠ 数据需为对象数组 [{...}, {...}]</div>';return}const keys=[...new Set(arr.flatMap(o=>Object.keys(o)))];let h='<table><thead><tr>'+keys.map(k=>`<th>${k}</th>`).join('')+'</tr></thead><tbody>';arr.forEach(r=>h+='<tr>'+keys.map(k=>`<td>${r[k]!=null?String(r[k]).replace(/</g,'&lt;'):''}</td>`).join('')+'</tr>');h+='</tbody></table>';csvTable.innerHTML=h}
function stats(){if(!parsedData)return;const t=Array.isArray(parsedData)?'数组':typeof parsedData==='object'?'对象':typeof parsedData;const k=typeof parsedData==='object'&&parsedData?Object.keys(parsedData).length:0;const b=new Blob([input.value]).size;const d=depth(parsedData);$('#statsBar').innerHTML=`<span>类型: ${t}</span><span>键数: ${k}</span><span>深度: ${d}</span><span>大小: ${b<1024?b+' B':b<1048576?(b/1024).toFixed(1)+' KB':(b/1048576).toFixed(2)+' MB'}</span>`}
function depth(o,d=0){if(!o||typeof o!=='object')return d;let m=d+1;for(const v of Object.values(o))m=Math.max(m,depth(v,d+1));return m}
function setMode(mode){
  currentMode=mode;$('#outputLabel').textContent={format:'格式化输出',minify:'压缩输出',validate:'校验结果',tree:'树形查看',csv:'CSV 表格'}[mode];
  document.querySelectorAll('.toolbar button[data-mode]').forEach(b=>b.classList.remove('active'));
  const t=document.querySelector(`.toolbar button[data-mode="${mode}"]`);if(t)t.classList.add('active');
  process();
}
function copyOutput(){const c=currentMode==='tree'?treeView.textContent:output.value;if(!c)return;navigator.clipboard.writeText(c).then(()=>toast('已复制'))}
function clearAll(){input.value='';output.value='';parsedData=null;hideOutputs();$('#inputCount').textContent='0 字符';$('#outputCount').textContent='0 字符';$('#statsBar').innerHTML='';errorMsg.classList.remove('show')}
function loadSample(){input.value=JSON.stringify({name:"张三",age:28,email:"zhangsan@example.com",skills:["JavaScript","Python","SQL"],address:{city:"北京",district:"朝阳区"},projects:[{title:"电商平台",status:"completed",stars:128},{title:"数据分析工具",status:"active",stars:56}]},null,2);process()}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000)}
loadSample();
</script>
</body>
</html>
